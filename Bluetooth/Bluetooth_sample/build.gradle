plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ramimartin.sample.bluetooth'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ramimartin.sample.bluetooth'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/services/javax.annotation.processing.Processor',
                    'META-INF/LICENSE.txt',
                    'META-INF/LICENSE',
                    'META-INF/NOTICE'
            ]
        }
    }
}

dependencies {
    implementation project(':Bluetooth_lib')
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
